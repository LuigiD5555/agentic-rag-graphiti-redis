# RabbitMQ 4.x Configuration File
# Minimal valid configuration for RabbitMQ 4.2.3-management-alpine

# Basic logging configuration
log.file.level = info
log.console.level = info

# Allow guest access from localhost only
loopback_users.guest = false

# Disable the deprecated management metrics collector
# This eliminates the warning about management_metrics_collection being deprecated
management_agent.disable_metrics_collector = true

# Connection and channel limits
channel_max = 2047
heartbeat = 60
frame_max = 131072

# Memory management
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.5

# Disk space monitoring
disk_free_limit.relative = 2.0

# Queue defaults
queue_index_embed_msgs_below = 4096

# TCP settings
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.linger.on = true
tcp_listen_options.linger.timeout = 0

# Management plugin settings
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
management.http_log_dir = /var/log/rabbitmq/management-access.log