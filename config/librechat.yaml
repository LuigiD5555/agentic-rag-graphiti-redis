# LibreChat Configuration
# Custom endpoint for RAG API

version: 1.1.5

cache: true

endpoints:
  custom:
    - name: "RAG API"
      apiKey: "not-needed"
      baseURL: "http://127.0.0.1:8000"
      models:
        default:
          - "default"
        fetch: true
      titleConvo: true
      titleModel: "default"
      summarize: false
      summaryModel: "default"
      forcePrompt: false
      modelDisplayLabel: "RAG API"
      addParams:
        max_tokens: 4096
        temperature: 0.7
      dropParams:
        - "top_p"
        - "frequency_penalty"
        - "presence_penalty"

      # File upload configuration for temporal RAG
      fileConfig:
        endpoints:
          default:
            fileLimit: 10
            fileSizeLimit: 50  # MB
            totalSizeLimit: 500  # MB
            supportedMimeTypes:
              - "application/pdf"
              - "text/plain"
              - "text/markdown"
              - "text/csv"
              - "application/msword"
              - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        serverFileSizeLimit: 100  # MB
        avatarSizeLimit: 2  # MB

registration:
  socialLogins: []
  allowedDomains: []

fileStrategy: "local"

rateLimits:
  fileUploads:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60
