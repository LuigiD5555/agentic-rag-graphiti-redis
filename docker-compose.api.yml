services:
  # RAG API Service (Personal/Local use)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: app
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload during development
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    environment:
      # Vector Store (Weaviate)
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_GRPC_PORT=50051
      - WEAVIATE_CLASS=RAGDocument
      - WEAVIATE_MULTI_TENANCY=true
      - WEAVIATE_DEFAULT_TENANT=tenant-default

      # Graph Store (Neo4j)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}

      # Cache (SQLite control plane)
      - CACHE_TTL=3600

      # LM Studio (LLM)
      - LMSTUDIO_HOST=host.docker.internal
      - LMSTUDIO_PORT=1234
      - PROVIDER=lmstudio
      - API_PORT=8000
      - RAG_AUTOSTART=${RAG_AUTOSTART:-false}

    depends_on:
      - weaviate
      - neo4j
    networks:
      - rag-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Weaviate Vector Store
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:latest
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - rag-network
    restart: unless-stopped

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - rag-network
    restart: unless-stopped


networks:
  rag-network:
    driver: bridge

volumes:
  weaviate-data:
  neo4j-data:
  neo4j-logs:
