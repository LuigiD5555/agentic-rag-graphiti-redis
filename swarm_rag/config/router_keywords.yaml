# Router keyword map — loaded at startup by Router.
#
# Format:
#   <plugin_name>:
#     keywords: [list of lowercase trigger words / substrings]
#
# The router always activates the "always_on" baseline set.
# Specialist plugins are activated when ANY keyword matches the query.

always_on:
  - retrieval
  - context_compressor
  - evidence_merger

keyword_map:
  math_understanding:
