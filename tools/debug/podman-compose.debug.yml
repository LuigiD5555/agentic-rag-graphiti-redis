version: '3.8'

services:
  # ============================================
  # Debugging Tools Container
  # ============================================
  # On-demand container with diagnostic utilities
  # Usage: podman-compose -f tools/debug/podman-compose.debug.yml up -d

  rag-debug:
    build:
      context: .
      dockerfile: Containerfile
    container_name: rag-debug

    # Access to main RAG network
    networks:
      - rag-network

    # Mount logs directory for journal_dump.sh
    volumes:
      - ../../logs:/logs:rw
      - /run/podman/podman.sock:/run/podman/podman.sock:ro  # Access to podman for monitoring

    # Environment variables
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}
      - ENABLE_LOG_EXPORT=${ENABLE_LOG_EXPORT:-1}
      - DEBOUNCE_SECONDS=${DEBOUNCE_SECONDS:-3}
      - DEFAULT_SINCE=${DEFAULT_SINCE:-24 hours ago}
      - MEMORY_THRESHOLD=${MEMORY_THRESHOLD:-85}

      # Access to RAG services
      - WEAVIATE_URL=http://weaviate:8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_URL=http://app:8001

    # Keep container running for exec commands
    command: tail -f /dev/null

    # Restart policy
    restart: unless-stopped

    # Resource limits (minimal)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  rag-network:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_rag-network
