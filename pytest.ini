[pytest]
# ============================================================================
# Pytest Configuration for RAG Agentic Graphiti
# ============================================================================

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# By default, skip integration tests (require RUN_INTEGRATION=1)
addopts =
    -m "not integration"
    --strict-markers
    --tb=short
    -ra

# Markers for test categorization
markers =
    # Test categories
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require services, set RUN_INTEGRATION=1)
    slow: Tests that take significant time to run

    # External service requirements
    requires_weaviate: Tests requiring Weaviate to be running
    requires_neo4j: Tests requiring Neo4j to be running
    requires_lmstudio: Tests requiring LM Studio to be running

    # Infrastructure tests
    infrastructure: Infrastructure and system verification tests
    preflight: Pre-flight system checks before startup
    preflight_host: Host-only preflight checks (podman/systemd/compose/.env)
    preflight_runtime: Runtime/container preflight checks (python deps/resources/paths)
    volumes: Volume verification and fallback setup tests

# Console output
console_output_style = progress
