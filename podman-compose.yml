version: "3.9"

name: ${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}

services:
  weaviate:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_weaviate_1"
    image: "docker.io/semitechnologies/weaviate:${WEAVIATE_IMAGE_TAG:?WEAVIATE_IMAGE_TAG is required}"
    restart: unless-stopped
    # Bind ONLY to localhost so it's not exposed to LAN
    ports:
      - "127.0.0.1:${HOST_WEAVIATE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${HOST_WEAVIATE_GRPC_PORT:-50051}:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=${WEAVIATE_QUERY_DEFAULTS_LIMIT:-25}
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - CLUSTER_HOSTNAME=${WEAVIATE_CLUSTER_HOSTNAME:-node1}
      - PERSISTENCE_DATA_PATH=${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}
      - GRPC_PORT=50051
      - ENABLE_MODULES=${WEAVIATE_ENABLE_MODULES:-}
      - LOG_LEVEL=${WEAVIATE_LOG_LEVEL:-INFO}
      - LIMIT_RESOURCES=${WEAVIATE_LIMIT_RESOURCES:-true}
      - DISABLE_TELEMETRY=${WEAVIATE_DISABLE_TELEMETRY:-true}
    volumes:
      - ${HOST_WEAVIATE_DATA:-weaviate_data}:${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/meta"]
      interval: 10s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${WEAVIATE_CPUS:-2.0}"
          memory: "${WEAVIATE_MEMORY:-4g}"

  neo4j:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_neo4j_1"
    image: "docker.io/library/neo4j:${NEO4J_IMAGE_TAG:?NEO4J_IMAGE_TAG is required}"
    restart: unless-stopped
    # Bind ONLY to localhost so it's not exposed to LAN
    ports:
      - "127.0.0.1:${HOST_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${HOST_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j123}"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_default__advertised__address: "neo4j"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INIT:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
      NEO4J_dbms_usage__report_enabled: "${NEO4J_USAGE_REPORT:-false}"
      NEO4J_client_allow__telemetry: "${NEO4J_TELEMETRY:-false}"
      NEO4J_server_config_strict__validation_enabled: "${NEO4J_STRICT_VALIDATION:-false}"
    volumes:
      - ${HOST_NEO4J_DATA:-neo4j_data}:/data:Z
      - ${HOST_NEO4J_LOGS:-neo4j_logs}:/logs:Z
    stop_grace_period: 45s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${NEO4J_CPUS:-2.0}"
          memory: "${NEO4J_MEMORY:-3g}"

  redis:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_redis_1"
    image: "docker.io/library/redis:${REDIS_IMAGE_TAG:?REDIS_IMAGE_TAG is required}"
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${HOST_REDIS_TCP_PORT:-6379}:6379"
    volumes:
      - ${HOST_REDIS_DATA:-redis_data}:/data:Z
    hostname: redis
    networks:
      default:
        aliases:
          - redis
    stop_grace_period: 20s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-1.0}"
          memory: "${REDIS_MEMORY:-512m}"

  app:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_app_1"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - weaviate
      - neo4j
      - redis
    env_file: .env

    # Share the host network namespace so 127.0.0.1 == host loopback
    network_mode: "host"

    environment:
      VECTOR_BACKEND: "${VECTOR_BACKEND:-weaviate}"

      # Point to host-published ports (all bound to 127.0.0.1)
      WEAVIATE_URL: "http://127.0.0.1:${HOST_WEAVIATE_HTTP_PORT:-8080}"
      WEAVIATE_GRPC_PORT: "${HOST_WEAVIATE_GRPC_PORT:-50051}"
      WEAVIATE_TIMEOUT: "${WEAVIATE_TIMEOUT:-60}"
      WEAVIATE_CLASS: "${WEAVIATE_CLASS:-RAGDocument}"
      WEAVIATE_MULTI_TENANCY: "${WEAVIATE_MULTI_TENANCY:-true}"
      WEAVIATE_SKIP_INIT_CHECKS: "${WEAVIATE_SKIP_INIT_CHECKS:-true}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-768}"
      WEAVIATE_LOG_LEVEL: "${WEAVIATE_LOG_LEVEL:-INFO}"

      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "${HOST_REDIS_TCP_PORT:-6379}"

      NEO4J_URI: "bolt://127.0.0.1:${HOST_NEO4J_BOLT_PORT:-7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j123}"

      # EXACT LM Studio URL kept as requested
      OPENAI_API_BASE: "http://127.0.0.1:${HOST_LMSTUDIO_HTTP_PORT:-1234}/v1"
      LMSTUDIO_HOST: "127.0.0.1"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-lm-studio}"

      MODEL_SELECTION: "${MODEL_SELECTION:-first-active}"
      LMSTUDIO_CHAT_MODEL: "${LMSTUDIO_CHAT_MODEL:-}"
      LMSTUDIO_EMBED_MODEL: "${LMSTUDIO_EMBED_MODEL:-}"

      DOCS_PATH: "${DOCS_PATH:-/mnt/Documents/Documents}"
      CHUNK_SIZE: "${CHUNK_SIZE:-500}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-50}"

      SOCKET_PORT: "${SOCKET_PORT:-5555}"

    volumes:
      - ${HOST_DOCS_DIR:?HOST_DOCS_DIR is required}:/mnt/Documents/Documents:Z
      - ${HOST_LIBROS_DIR:-/mnt/resources/Libros}:/mnt/resources/Libros:Z
      - ${HOST_DATA_DIR:-./data}:/data:Z
      - ./.enabledpaths:/app/.enabledpaths:ro,Z
      - ./.ingestignore:/app/.ingestignore:ro,Z

    # Do NOT publish container ports; app binds to 127.0.0.1 via host network
    command: ["python", "-m", "src.main"]

    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',int(os.environ.get('SOCKET_PORT','5555')))); s.close()"]
      interval: 15s
      timeout: 3s
      retries: 10

    stop_grace_period: 30s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2.0}"
          memory: "${APP_MEMORY:-3g}"

volumes:
  neo4j_data: {}
  neo4j_logs: {}
  weaviate_data: {}
  redis_data: {}
