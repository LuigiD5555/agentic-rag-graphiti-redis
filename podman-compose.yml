services:
  weaviate:
    image: docker.io/semitechnologies/weaviate:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - QUERY_DEFAULTS_LIMIT=25
      - ENABLE_MODULES=text2vec-openai
      - CLUSTER_HOSTNAME=weaviate-node-1
      - RAFT_BOOTSTRAP_EXPECTED_PEERS=1
    volumes:
      - weaviate_data:/var/lib/weaviate

  redis:
    image: docker.io/library/redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"

  neo4j:
    image: docker.io/library/neo4j:5
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  app:
    build: .
    restart: unless-stopped
    environment:
      - WEAVIATE_URL=${WEAVIATE_URL}
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY}
      - WEAVIATE_CLASS=${WEAVIATE_CLASS}
      - WEAVIATE_MULTI_TENANCY=${WEAVIATE_MULTI_TENANCY}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LMSTUDIO_HOST=${LMSTUDIO_HOST}
      - LMSTUDIO_PORT=${LMSTUDIO_PORT}
      - AUTO_SOCKET=true
    volumes:
      - /home/luiginorp/Documents:/mnt/Documents/Documents:Z
    network_mode: host

volumes:
  weaviate_data:
  redis_data:
  neo4j_data:
