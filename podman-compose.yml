services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: docker.io/library/redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: docker.io/library/neo4j:latest
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
    volumes:
      - neo4j_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - qdrant
      - redis
      - neo4j
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LMSTUDIO_HOST=${LMSTUDIO_HOST}
      - LMSTUDIO_PORT=${LMSTUDIO_PORT}
      - AUTO_SOCKET=true
    volumes:
      - /home/luiginorp/Documents:/mnt/Documents/Documents:Z
    network_mode: host

volumes:
  qdrant_data:
  redis_data:
  neo4j_data:
