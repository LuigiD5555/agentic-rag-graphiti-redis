name: ${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}

# podman-compose will automatically load .env files in this order:
# 1. .env (main configuration)
# 2. .env.volumes (generated by check-volumes.sh)

services:
  weaviate:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_weaviate_1"
    image: "docker.io/semitechnologies/weaviate:${WEAVIATE_IMAGE_TAG:?WEAVIATE_IMAGE_TAG is required}"
    restart: "unless-stopped"
    logging:
      driver: journald
    # Bind ONLY to localhost so it's not exposed to LAN
    network_mode: "host"
    environment:
      - QUERY_DEFAULTS_LIMIT=${WEAVIATE_QUERY_DEFAULTS_LIMIT:-25}
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - CLUSTER_HOSTNAME=${WEAVIATE_CLUSTER_HOSTNAME:-node1}
      - PERSISTENCE_DATA_PATH=${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}
      - GRPC_PORT=50051
      - ENABLE_MODULES=${WEAVIATE_ENABLE_MODULES:-}
      - LOG_LEVEL=${WEAVIATE_LOG_LEVEL:-INFO}
      - LIMIT_RESOURCES=${WEAVIATE_LIMIT_RESOURCES:-true}
      - DISABLE_TELEMETRY=${WEAVIATE_DISABLE_TELEMETRY:-true}
    volumes:
      - ${HOST_WEAVIATE_DATA:-weaviate_data}:${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/meta"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${WEAVIATE_CPUS:-4.0}"
          memory: "${WEAVIATE_MEMORY:-8g}"

  neo4j:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_neo4j_1"
    image: "docker.io/library/neo4j:${NEO4J_IMAGE_TAG:?NEO4J_IMAGE_TAG is required}"
    restart: "no"
    logging:
      driver: journald
    # Only start when explicitly requested via profile (optional plugin)
    profiles:
      - neo4j
    # Bind ONLY to localhost so it's not exposed to LAN
    network_mode: "host"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j123}"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_default__advertised__address: "neo4j"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INIT:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
      NEO4J_dbms_usage__report_enabled: "${NEO4J_USAGE_REPORT:-false}"
      NEO4J_client_allow__telemetry: "${NEO4J_TELEMETRY:-false}"
      NEO4J_server_config_strict__validation_enabled: "${NEO4J_STRICT_VALIDATION:-false}"
    volumes:
      - ${HOST_NEO4J_DATA:-neo4j_data}:/data:Z
      - ${HOST_NEO4J_LOGS:-neo4j_logs}:/logs:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7474"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    stop_grace_period: 45s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${NEO4J_CPUS:-2.0}"
          memory: "${NEO4J_MEMORY:-3g}"

  # SQLite control plane stores metadata in ./data/control_plane.db

  open-webui:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_open-webui_1"
    build:
      context: ./open-webui
      dockerfile: Dockerfile
    image: "open-webui-local:${OPEN_WEBUI_IMAGE_TAG:-main-slim}"
    restart: "no"
    logging:
      driver: journald
    # Only start when explicitly requested via profile
    profiles:
      - webui
    depends_on:
      app:
        condition: service_healthy
    # Share the host network namespace for localhost-only operation
    network_mode: "host"
    environment:
      # Point to RAG API on localhost (both containers use host network)
      OPENAI_API_BASE_URL: "http://127.0.0.1:${HOST_RAG_API_PORT:-8000}/v1"
      OPENAI_API_KEY: "not-needed"
      RAG_AGENTIC_API_BASE_URL: "http://127.0.0.1:${HOST_RAG_API_PORT:-8000}"
      RAG_POWER_DAEMON_URL: "${RAG_POWER_DAEMON_URL:-http://127.0.0.1:9009}"

      # Disable internal Ollama since we use external RAG API
      ENABLE_OLLAMA_API: "false"

      # WebUI configuration
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-change-this-secret-in-production}"
      # Restrict CORS to localhost only
      CORS_ALLOW_ORIGIN: "http://127.0.0.1:${HOST_OPEN_WEBUI_PORT:-5555};http://localhost:${HOST_OPEN_WEBUI_PORT:-5555}"

      # Open WebUI binds to this port on localhost
      PORT: "${HOST_OPEN_WEBUI_PORT:-5555}"

      # Optional: Disable features we don't need
      ENABLE_RAG_WEB_SEARCH: "false"
      ENABLE_IMAGE_GENERATION: "false"
      # Required by recent Open WebUI builds to avoid config lookup errors
      RAG_PERFORMANCE_PROFILE: "balanced"

      # Avoid local embedding model load; use RAG API instead
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_OPENAI_API_BASE_URL: "http://127.0.0.1:${HOST_RAG_API_PORT:-8000}/v1"
      RAG_OPENAI_API_KEY: "not-needed"

      # Skip alembic migrations on startup (DB already exists)
      SKIP_DB_MIGRATIONS: "false"
      # Avoid slow torch import during env initialization
      SKIP_TORCH_IMPORT: "true"
      # Avoid parsing CHANGELOG at startup
      SKIP_CHANGELOG: "true"

      # Use Weaviate instead of Chroma to avoid heavy chromadb imports
      VECTOR_DB: "weaviate"
      WEAVIATE_HTTP_HOST: "127.0.0.1"
      WEAVIATE_HTTP_PORT: "${HOST_WEAVIATE_HTTP_PORT:-8080}"
      WEAVIATE_GRPC_PORT: "${WEAVIATE_GRPC_PORT:-50051}"

    volumes:
      - ${HOST_OPEN_WEBUI_DATA:-open-webui_data}:/app/backend/data:Z

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${HOST_OPEN_WEBUI_PORT:-5555}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${OPEN_WEBUI_CPUS:-1.0}"
          memory: "${OPEN_WEBUI_MEMORY:-1g}"

  app:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_app_1"
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: "unless-stopped"
    logging:
      driver: journald
    depends_on:
      weaviate:
        condition: service_healthy
    env_file: .env

    # Share the host network namespace so 127.0.0.1 == host loopback
    network_mode: "host"

    environment:
      VECTOR_BACKEND: "${VECTOR_BACKEND:-weaviate}"

      # Point to host-published ports (all bound to 127.0.0.1)
      WEAVIATE_URL: "http://127.0.0.1:${HOST_WEAVIATE_HTTP_PORT:-8080}"
      WEAVIATE_GRPC_PORT: "${HOST_WEAVIATE_GRPC_PORT:-50051}"
      WEAVIATE_TIMEOUT: "${WEAVIATE_TIMEOUT:-60}"
      WEAVIATE_CLASS: "${WEAVIATE_CLASS:-RAGDocument}"
      WEAVIATE_MULTI_TENANCY: "${WEAVIATE_MULTI_TENANCY:-true}"
      WEAVIATE_DEFAULT_TENANT: "${WEAVIATE_DEFAULT_TENANT:-tenant-default}"
      WEAVIATE_SKIP_INIT_CHECKS: "${WEAVIATE_SKIP_INIT_CHECKS:-true}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-768}"
      WEAVIATE_LOG_LEVEL: "${WEAVIATE_LOG_LEVEL:-INFO}"

      # SQLite control plane configuration
      CONTROL_PLANE_DB_PATH: "${CONTROL_PLANE_DB_PATH:-/app/data/control_plane.db}"
      CONVERSATION_PERSISTENCE_ENABLED: "${CONVERSATION_PERSISTENCE_ENABLED:-false}"
      SANITIZER_ENABLED: "${SANITIZER_ENABLED:-true}"
      SECRETS_STRIP_ALWAYS: "${SECRETS_STRIP_ALWAYS:-true}"
      PII_MASKING_DEFAULT: "${PII_MASKING_DEFAULT:-OFF}"
      RERANK_ENABLED: "${RERANK_ENABLED:-false}"
      RERANK_MAX_CANDIDATES: "${RERANK_MAX_CANDIDATES:-20}"
      RERANK_TOP_N: "${RERANK_TOP_N:-8}"
      RERANK_MODE: "${RERANK_MODE:-mmr}"
      RETRIEVE_TOP_K_CANDIDATES: "${RETRIEVE_TOP_K_CANDIDATES:-30}"

      NEO4J_URI: "bolt://127.0.0.1:${HOST_NEO4J_BOLT_PORT:-7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j123}"

      # EXACT LM Studio URL kept as requested
      OPENAI_API_BASE: "http://127.0.0.1:${HOST_LMSTUDIO_HTTP_PORT:-1234}/v1"
      LMSTUDIO_HOST: "127.0.0.1"
      LM_LLM_URL: "http://127.0.0.1:${HOST_LMSTUDIO_HTTP_PORT:-1234}/v1"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-lm-studio}"

      MODEL_SELECTION: "${MODEL_SELECTION:-first-active}"
      LMSTUDIO_CHAT_MODEL: "${LMSTUDIO_CHAT_MODEL:-liquid/lfm2-1.2b}"
      LMSTUDIO_EMBED_MODEL: "${LMSTUDIO_EMBED_MODEL:-text-embedding-nomic-embed-text-v2-moe}"

      DOCS_PATH: "${DOCS_PATH:-/mnt/Documents/Documents}"
      CHUNK_SIZE: "${CHUNK_SIZE:-500}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-50}"

      # Unified RAG API port (consolidated from separate API proxy)
      API_PORT: "${HOST_RAG_API_PORT:-8000}"
      API_MODE: "${API_MODE:-ollama}"
      RAG_AUTOSTART: "${RAG_AUTOSTART:-false}"
      
      # Embeddings (make explicit; do not rely on env_file parsing)
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v2-moe}"

    volumes:
      # ============================================================================
      # External Volumes (Auto-detected from EXTERNAL_VOLUMES in .env)
      # ============================================================================
      # These volumes are configured in .env using EXTERNAL_VOLUMES JSON array.
      # The system auto-detects if volumes are available using .volume-available markers.
      # If a volume is unavailable, it falls back to ./data/<name>-fallback
      #
      # To add a new external volume:
      # 1. Add to EXTERNAL_VOLUMES in .env (see .env for format)
      # 2. Add corresponding mount entry here: - ${HOST_<NAME>_DIR:-./data/<name>-fallback}:/mnt/resources/<Name>:Z
      # 3. Create .volume-available marker: touch /path/to/volume/.volume-available
      # 4. Run: python -m src.utils.volume_compose_generator list (to verify)
      #
      # Example for a "Research" volume:
      #   - ${HOST_RESEARCH_DIR:-./data/research-fallback}:/mnt/resources/Research:Z
      # ============================================================================

      # External volume: Documents (auto-detected from EXTERNAL_VOLUMES)
      - ${HOST_DOCUMENTS_DIR:-./data/documents-fallback}:/mnt/Documents/Documents:Z
      # External volume: Libros (auto-detected from EXTERNAL_VOLUMES)
      - ${ACTIVE_LIBROS_DIR:-./data/libros-fallback}:/mnt/resources/Libros:Z

      # Add more external volumes here as needed (see instructions above)

      # ============================================================================

      - ${HOST_DATA_DIR:-./data}:/app/data:Z
      - ./.ingestignore:/app/.ingestignore:Z
      # Mount source for hot-reload during development
      - ./src:/app/src:ro,Z
      - ./tests:/app/tests:ro,Z

    # Run as HTTP server (unified RAG API - consolidated from separate API proxy)
    # App binds to 127.0.0.1:8000 inside container via host network mode
    healthcheck:
      test: ["CMD", "python", "-c", "import os, requests; requests.get(f'http://127.0.0.1:{os.getenv(\"API_PORT\", \"8000\")}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    stop_grace_period: 30s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2.0}"
          memory: "${APP_MEMORY:-3g}"

  autoscan:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_autoscan_1"
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: "unless-stopped"
    logging:
      driver: journald
    depends_on:
      weaviate:
        condition: service_healthy
    env_file: .env
    environment:
      - AUTO_SCAN_ENABLED=true
      - CONTROL_PLANE_DB_PATH=/app/data/control_plane.db
      - WEAVIATE_URL=http://127.0.0.1:${HOST_WEAVIATE_HTTP_PORT:-8080}
      - WEAVIATE_GRPC_PORT=${HOST_WEAVIATE_GRPC_PORT:-50051}
      - WEAVIATE_TIMEOUT=${WEAVIATE_TIMEOUT:-60}
      - WEAVIATE_CLASS=${WEAVIATE_CLASS:-RAGDocument}
      - WEAVIATE_MULTI_TENANCY=${WEAVIATE_MULTI_TENANCY:-true}
      - WEAVIATE_DEFAULT_TENANT=${WEAVIATE_DEFAULT_TENANT:-tenant-default}
      - WEAVIATE_SKIP_INIT_CHECKS=${WEAVIATE_SKIP_INIT_CHECKS:-true}
      - WEAVIATE_LOG_LEVEL=${WEAVIATE_LOG_LEVEL:-INFO}
      - NEO4J_URI=bolt://127.0.0.1:${HOST_NEO4J_BOLT_PORT:-7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j123}
    network_mode: "host"
    volumes:
      - ${HOST_DOCUMENTS_DIR:-./data/documents-fallback}:/mnt/Documents/Documents:Z
      - ${ACTIVE_LIBROS_DIR:-./data/libros-fallback}:/mnt/resources/Libros:Z
      - ${HOST_DATA_DIR:-./data}:/app/data:Z
      - ./.ingestignore:/app/.ingestignore:Z
      - ./src:/app/src:ro,Z
      - ./tests:/app/tests:ro,Z
    command: ["python", "-m", "src.workflows.ingestion.auto_scan.scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.path.insert(0, '/app'); from src.workflows.ingestion.auto_scan.scheduler import check_health; exit(0 if check_health() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${AUTO_SCAN_CPUS:-0.5}"
          memory: "${AUTO_SCAN_MEMORY:-1g}"

  monitoring:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_monitoring_1"
    build:
      context: .
      dockerfile: tools/monitoring/Dockerfile
    restart: "unless-stopped"
    logging:
      driver: journald
    depends_on:
      app:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    env_file: 
      - ./.env

    # Share host network to access all services
    network_mode: "host"

    environment:
      # Monitoring configuration
      MONITORING_INTERVAL: "${MONITORING_INTERVAL:-300}"
      ENABLE_LOG_ANALYSIS: "${ENABLE_LOG_ANALYSIS:-true}"
      ENABLE_VOLUME_MONITORING: "${ENABLE_VOLUME_MONITORING:-true}"
      ENABLE_HEALTH_CHECKS: "${ENABLE_HEALTH_CHECKS:-true}"
      ENABLE_MEMORY_MONITORING: "${ENABLE_MEMORY_MONITORING:-true}"
      ENABLE_VULTURE_MONITORING: "${ENABLE_VULTURE_MONITORING:-false}"
      VULTURE_INTERVAL: "${VULTURE_INTERVAL:-3600}"
      VULTURE_MIN_CONFIDENCE: "${VULTURE_MIN_CONFIDENCE:-80}"
      VULTURE_TARGETS: "${VULTURE_TARGETS:-/workspace/src}"
      VULTURE_EXCLUDE: "${VULTURE_EXCLUDE:-.git,dist,build,__pycache__}"
      MEMORY_MONITOR_MODE: "${MEMORY_MONITOR_MODE:-auto}"
      MEMORY_MONITOR_INTERVAL: "${MEMORY_MONITOR_INTERVAL:-10}"
      MEMORY_WARNING_THRESHOLD: "${MEMORY_WARNING_THRESHOLD:-70}"
      MEMORY_CRITICAL_THRESHOLD: "${MEMORY_CRITICAL_THRESHOLD:-85}"
      MEMORY_MONITOR_CONTAINER: "${MEMORY_MONITOR_CONTAINER:-}"
      LOG_LEVEL: "${MONITORING_LOG_LEVEL:-INFO}"

      # Service endpoints (via host network)
      WEAVIATE_URL: "http://127.0.0.1:${HOST_WEAVIATE_HTTP_PORT:-8080}"
      WEAVIATE_GRPC_PORT: "${HOST_WEAVIATE_GRPC_PORT:-50051}"
      NEO4J_URI: "bolt://127.0.0.1:${HOST_NEO4J_BOLT_PORT:-7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j123}"

      # Dashboard port (optional)
      DASHBOARD_PORT: "${MONITORING_DASHBOARD_PORT:-8888}"

    volumes:
      # Access to systemd journal logs (read-only)
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      # Mount workspace for vulture scans (read-only)
      - ./:/workspace:ro,Z
      # Persistent data
      - ${HOST_MONITORING_LOGS:-monitoring_logs}:/app/logs:Z
      - ${HOST_MONITORING_REPORTS:-monitoring_reports}:/app/reports:Z
      - ${HOST_MONITORING_DATA:-monitoring_data}:/app/data:Z

    # Optional: expose dashboard
    # ports:
    #   - "127.0.0.1:${MONITORING_DASHBOARD_PORT:-8888}:8888"

    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${MONITORING_CPUS:-0.5}"
          memory: "${MONITORING_MEMORY:-512m}"

  rabbitmq:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_rabbitmq_1"
    image: "docker.io/library/rabbitmq:${RABBITMQ_IMAGE_TAG:-4.2.3-management-alpine}"
    restart: "no"
    logging:
      driver: journald
    network_mode: "host"
    # Remove explicit user specification to let RabbitMQ run with default permissions
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-change-me-rabbitmq}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/rag}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels [{connection,error},{default,error}]
      - RABBITMQ_LOGS=-
      - RABBITMQ_SASL_LOGS=-
    volumes:
      - ${HOST_RABBITMQ_DATA:-rabbitmq_data}:/var/lib/rabbitmq:Z
      - ${HOST_RABBITMQ_LOGS:-rabbitmq_logs}:/var/log/rabbitmq:Z
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:Z
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${RABBITMQ_CPUS:-0.5}"
          memory: "${RABBITMQ_MEMORY:-512m}"

volumes:
  neo4j_data: {}
  neo4j_logs: {}
  weaviate_data: {}
  open-webui_data: {}
  monitoring_logs: {}
  monitoring_reports: {}
  monitoring_data: {}
  rabbitmq_data: {}
  rabbitmq_logs: {}
