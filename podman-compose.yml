version: "3.9"

name: rag-graphiti-agentic

services:
  weaviate:
    image: "docker.io/semitechnologies/weaviate:${WEAVIATE_IMAGE_TAG:-1.33.0}"
    restart: unless-stopped
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - CLUSTER_HOSTNAME=node1
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - GRPC_PORT=50051
      - ENABLE_MODULES=
      - LOG_LEVEL=info                  # explicit log level
      - LIMIT_RESOURCES=true            # let Weaviate self-throttle
      - DISABLE_TELEMETRY=true          # optional: disable phone-home
    ports:
      - "8080:8080"       # REST
      - "50051:50051"     # gRPC
    volumes:
      - weaviate_data:/var/lib/weaviate:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/meta"]
      interval: 10s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s             # graceful shutdown
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4g"

  neo4j:
    image: docker.io/library/neo4j:${NEO4J_IMAGE_TAG:-5}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j123}"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_default__advertised__address: "neo4j"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
      NEO4J_server_analytics_enabled: "false"   # optional: disable usage analytics
      NEO4J_server_metrics_enabled: "false"     # optional: disable metrics export
      NEO4J_dbms_usage__report_enabled: "false"  # disable anonymous usage report
      NEO4J_clients_allow__telemetry: "false"

    ports:
      - "7474:7474"       # HTTP UI
      - "7687:7687"       # Bolt
    volumes:
      - neo4j_data:/data:Z
      - neo4j_logs:/logs:Z
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "3g"

  redis:
    image: docker.io/library/redis:${REDIS_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # no snapshots, no AOF
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:Z
    stop_grace_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "host"               # direct access to host services
    depends_on:
      - weaviate
      - neo4j
      - redis
    env_file: .env
    environment:
      # === Vector DB (Weaviate) ===
      VECTOR_BACKEND: "weaviate"
      WEAVIATE_URL: "http://127.0.0.1:8080"
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_TIMEOUT: "60"
      WEAVIATE_CLASS: "RAGDocument"
      WEAVIATE_MULTI_TENANCY: "true"
      EMBEDDING_DIM: "768"

      # === Redis Cache ===
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"

      # === Neo4j (Graph) ===
      NEO4J_URI: "bolt://127.0.0.1:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j123}"

      # === LM Studio (local OpenAI-compatible API) ===
      OPENAI_API_BASE: "http://127.0.0.1:1234/v1"
      LMSTUDIO_HOST: "127.0.0.1"
      OPENAI_API_KEY: "lm-studio"

      # === Model selection ===
      MODEL_SELECTION: "first-active"
      LMSTUDIO_CHAT_MODEL: ""
      LMSTUDIO_EMBED_MODEL: ""

      # === Ingestion ===
      DOCS_PATH: "/mnt/Documents/Documents"
      CHUNK_SIZE: "500"
      CHUNK_OVERLAP: "50"

      # === App socket ===
      SOCKET_PORT: "5555"
    volumes:
      - /home/luiginorp/Documents:/mnt/Documents/Documents:Z
      - ./data:/data:Z
    command: ["python", "-m", "src.main", "--socket"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',int(__import__('os').environ.get('SOCKET_PORT','5555')))); s.close()"]
      interval: 15s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "3g"

  # graphiti:
  #   image: ghcr.io/getzep/graphiti:latest
  #   restart: unless-stopped
  #   depends_on:
  #     - neo4j
  #   environment:
  #     NEO4J_URI: "bolt://neo4j:7687"
  #     NEO4J_USER: "neo4j"
  #     NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j123}"
  #   ports:
  #     - "8000:8000"

volumes:
  neo4j_data: {}
  neo4j_logs: {}
  weaviate_data: {}
  redis_data: {}
