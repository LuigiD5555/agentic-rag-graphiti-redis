version: "3.9"

name: rag-graphiti-agentic

services:
  weaviate:
    image: "docker.io/semitechnologies/weaviate:${WEAVIATE_IMAGE_TAG:-1.33.0}"
    restart: unless-stopped
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - CLUSTER_HOSTNAME=node1
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - GRPC_PORT=50051
      # using external embeddings (LM Studio)
      - ENABLE_MODULES=
    ports:
      - "8080:8080"                     # REST
      - "50051:50051"                   # gRPC
    volumes:
      - weaviate_data:/var/lib/weaviate:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/meta"]
      interval: 10s
      timeout: 3s
      retries: 20

  neo4j:
    image: docker.io/library/neo4j:latest
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j123}"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_default__advertised__address: "neo4j"
      # Memory tuning — adjust to your host capacity:
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
    ports:
      - "7474:7474"                      # HTTP UI
      - "7687:7687"                      # Bolt
    volumes:
      - neo4j_data:/data:Z
      - neo4j_logs:/logs:Z

  redis:
    image: docker.io/library/redis:latest
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:Z

  # Your RAG app (host network so it can reach LM Studio & service ports directly)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Linux-only: share host network namespace
    # App reaches:
    # - LM Studio at http://127.0.0.1:1234
    # - Weaviate at http://127.0.0.1:8080 (published above)
    # - Neo4j at bolt://127.0.0.1:7687 (published above)
    # - Redis at 127.0.0.1:6379 (published above)
    network_mode: "host"

    depends_on:
      - weaviate
      - neo4j
      - redis

    env_file: .env

    environment:
      # === Vector DB (Weaviate) via host-mapped ports ===
      VECTOR_BACKEND: "weaviate"
      WEAVIATE_URL: "http://127.0.0.1:8080"
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_TIMEOUT: "60"
      WEAVIATE_CLASS: "RAGDocument"
      WEAVIATE_MULTI_TENANCY: "true"
      EMBEDDING_DIM: "768"

      # === Redis Cache via host-mapped port ===
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"

      # === Neo4j (Graph store) via host-mapped port ===
      NEO4J_URI: "bolt://127.0.0.1:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j123}"

      # === LM Studio (OpenAI-compatible) running on the host ===
      OPENAI_API_BASE: "http://127.0.0.1:1234/v1"
      # Force LM Studio host to loopback so the app does not try
      # host.containers.internal first (which can refuse connections
      # when LM Studio only binds to 127.0.0.1). This removes the
      # startup error and uses the working endpoint immediately.
      LMSTUDIO_HOST: "127.0.0.1"
      OPENAI_API_KEY: "lm-studio"         # placeholder (LM Studio typically ignores it)
      LMSTUDIO_CHAT_MODEL: ""             # e.g., "microsoft/phi-4-mini-reasoning"
      LMSTUDIO_EMBED_MODEL: ""            # e.g., "nomic-embed-text-v1.5"

      # === Ingestion (CRITICAL PATH) ===
      DOCS_PATH: "/mnt/Documents/Documents"
      CHUNK_SIZE: "500"
      CHUNK_OVERLAP: "50"

      # === App socket (CLI/agent interface) ===
      SOCKET_PORT: "5555"

    # With host network, you DO NOT publish ports here.
    # ports: ["5555:5555"]
    # extra_hosts: []

    volumes:
      # Keep your absolute host path EXACTLY as requested:
      - /home/luiginorp/Documents:/mnt/Documents/Documents:Z
      # (optional) generic data area inside the container if used by your app
      - ./data:/data:Z

    command: ["python", "-m", "src.main", "--socket"]

  # Optional: Graphiti REST API (disabled by default). If you enable it,
  # keep it on bridge and access from host at localhost:8000.
  # graphiti:
  #   image: ghcr.io/getzep/graphiti:latest
  #   restart: unless-stopped
  #   depends_on:
  #     - neo4j
  #   environment:
  #     NEO4J_URI: "bolt://neo4j:7687"
  #     NEO4J_USER: "neo4j"
  #     NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j123}"
  #     OPENAI_API_BASE: "http://127.0.0.1:1234/v1"
  #     OPENAI_API_KEY: "lm-studio"
  #   ports:
  #     - "8000:8000"

volumes:
  neo4j_data: {}
  neo4j_logs: {}
  weaviate_data: {}
  redis_data: {}
