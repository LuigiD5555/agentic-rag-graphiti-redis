name: ${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}

# podman-compose will automatically load .env files in this order:
# 1. .env (main configuration)
# 2. .env.volumes (generated by check-volumes.sh)

services:
  weaviate:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_weaviate_1"
    image: "docker.io/semitechnologies/weaviate:${WEAVIATE_IMAGE_TAG:?WEAVIATE_IMAGE_TAG is required}"
    restart: unless-stopped
    logging:
      driver: journald
    # Bind ONLY to localhost so it's not exposed to LAN
    ports:
      - "127.0.0.1:${HOST_WEAVIATE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${HOST_WEAVIATE_GRPC_PORT:-50051}:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=${WEAVIATE_QUERY_DEFAULTS_LIMIT:-25}
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - CLUSTER_HOSTNAME=${WEAVIATE_CLUSTER_HOSTNAME:-node1}
      - PERSISTENCE_DATA_PATH=${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}
      - GRPC_PORT=50051
      - ENABLE_MODULES=${WEAVIATE_ENABLE_MODULES:-}
      - LOG_LEVEL=${WEAVIATE_LOG_LEVEL:-INFO}
      - LIMIT_RESOURCES=${WEAVIATE_LIMIT_RESOURCES:-true}
      - DISABLE_TELEMETRY=${WEAVIATE_DISABLE_TELEMETRY:-true}
    volumes:
      - ${HOST_WEAVIATE_DATA:-weaviate_data}:${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/meta"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${WEAVIATE_CPUS:-4.0}"
          memory: "${WEAVIATE_MEMORY:-8g}"

  neo4j:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_neo4j_1"
    image: "docker.io/library/neo4j:${NEO4J_IMAGE_TAG:?NEO4J_IMAGE_TAG is required}"
    restart: unless-stopped
    logging:
      driver: journald
    # Bind ONLY to localhost so it's not exposed to LAN
    ports:
      - "127.0.0.1:${HOST_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${HOST_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j123}"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_default__advertised__address: "neo4j"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INIT:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
      NEO4J_dbms_usage__report_enabled: "${NEO4J_USAGE_REPORT:-false}"
      NEO4J_client_allow__telemetry: "${NEO4J_TELEMETRY:-false}"
      NEO4J_server_config_strict__validation_enabled: "${NEO4J_STRICT_VALIDATION:-false}"
    volumes:
      - ${HOST_NEO4J_DATA:-neo4j_data}:/data:Z
      - ${HOST_NEO4J_LOGS:-neo4j_logs}:/logs:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7474"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    stop_grace_period: 45s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${NEO4J_CPUS:-2.0}"
          memory: "${NEO4J_MEMORY:-3g}"

  redis:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_redis_1"
    image: "docker.io/library/redis:${REDIS_IMAGE_TAG:?REDIS_IMAGE_TAG is required}"
    restart: unless-stopped
    logging:
      driver: journald
    # AOF persistence with 1-day session TTL
    # - appendonly yes: Enable AOF (Append-Only File) for durability
    # - appendfsync everysec: Fsync every second (balance durability/performance)
    # - save "": Disable RDB snapshots (AOF is enough for sessions)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    ports:
      - "127.0.0.1:${HOST_REDIS_TCP_PORT:-6379}:6379"
    volumes:
      - ${HOST_REDIS_DATA:-redis_data}:/data:Z
    hostname: redis
    networks:
      default:
        aliases:
          - redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q '^PONG$' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    stop_grace_period: 20s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-1.0}"
          memory: "${REDIS_MEMORY:-1g}"

  rag-api:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_rag-api_1"
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    restart: unless-stopped
    logging:
      driver: journald
    depends_on:
      app:
        condition: service_healthy
    env_file: .env

    # Share the host network namespace so 127.0.0.1 == host loopback
    network_mode: "host"

    environment:
      # Proxy to core service (app container on port 8001)
      CORE_SERVICE_URL: "http://127.0.0.1:${HOST_CORE_SERVICE_PORT:-8001}"
      CORE_TIMEOUT: "${CORE_TIMEOUT:-120}"

      # API mode (openai or ollama)
      API_MODE: "${API_MODE:-ollama}"

      # RAG API port (public-facing proxy)
      API_PORT: "${HOST_RAG_API_PORT:-8000}"

    # API binds to 0.0.0.0:8000 inside container, accessible at 127.0.0.1:8000 on host via host network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:${HOST_RAG_API_PORT:-8000}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    stop_grace_period: 20s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.5}"
          memory: "${API_MEMORY:-256m}"

  librechat:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_librechat_1"
    image: "ghcr.io/danny-avila/librechat:${LIBRECHAT_IMAGE_TAG:-latest}"
    restart: unless-stopped
    logging:
      driver: journald
    depends_on:
      rag-api:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Use host network to access rag-api and redis on 127.0.0.1
    network_mode: "host"

    environment:
      # Host and port (LibreChat binds to this when using host network)
      HOST: "0.0.0.0"
      PORT: "${HOST_LIBRECHAT_PORT:-3080}"

      # MongoDB (LibreChat's internal DB) - use host network
      MONGO_URI: "mongodb://127.0.0.1:27017/LibreChat"

      # Custom OpenAI endpoint pointing to RAG API
      ENDPOINTS: "custom"

      # Custom endpoint configuration
      CUSTOM_OPENAI_BASE_URL: "http://127.0.0.1:${HOST_RAG_API_PORT:-8000}"
      CUSTOM_OPENAI_API_KEY: "not-needed"
      CUSTOM_OPENAI_MODELS: "default"

      # Session secret
      CREDS_KEY: "${LIBRECHAT_CREDS_KEY:-change-this-secret-in-production}"
      CREDS_IV: "${LIBRECHAT_CREDS_IV:-change-this-iv-in-production}"
      JWT_SECRET: "${LIBRECHAT_JWT_SECRET:-change-this-jwt-secret}"
      JWT_REFRESH_SECRET: "${LIBRECHAT_JWT_REFRESH_SECRET:-change-this-refresh-secret}"

      # File uploads (for temporal RAG)
      ENABLE_FILE_UPLOADS: "true"
      FILE_UPLOAD_SIZE_LIMIT: "${TEMPORAL_FILE_MAX_SIZE_MB:-50}"
      FILES_ENDPOINT: "http://127.0.0.1:${HOST_RAG_API_PORT:-8000}/v1/files"

      # Disable telemetry
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_REGISTRATION: "true"

    volumes:
      - ${HOST_LIBRECHAT_DATA:-librechat_data}:/app/client/public/images:Z
      - ${HOST_LIBRECHAT_CONFIG:-./config/librechat.yaml}:/app/librechat.yaml:ro,Z

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${HOST_LIBRECHAT_PORT:-3080}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${LIBRECHAT_CPUS:-1.0}"
          memory: "${LIBRECHAT_MEMORY:-1g}"

  mongodb:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_mongodb_1"
    image: "docker.io/library/mongo:${MONGODB_IMAGE_TAG:-7}"
    restart: unless-stopped
    logging:
      driver: journald
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: "LibreChat"
    volumes:
      - ${HOST_MONGODB_DATA:-mongodb_data}:/data/db:Z
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${MONGODB_CPUS:-1.0}"
          memory: "${MONGODB_MEMORY:-512m}"

  app:
    container_name: "${COMPOSE_PROJECT_NAME:-rag-graphiti-agentic}_app_1"
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    logging:
      driver: journald
    depends_on:
      weaviate:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

    # Share the host network namespace so 127.0.0.1 == host loopback
    network_mode: "host"

    environment:
      VECTOR_BACKEND: "${VECTOR_BACKEND:-weaviate}"

      # Point to host-published ports (all bound to 127.0.0.1)
      WEAVIATE_URL: "http://127.0.0.1:${HOST_WEAVIATE_HTTP_PORT:-8080}"
      WEAVIATE_GRPC_PORT: "${HOST_WEAVIATE_GRPC_PORT:-50051}"
      WEAVIATE_TIMEOUT: "${WEAVIATE_TIMEOUT:-60}"
      WEAVIATE_CLASS: "${WEAVIATE_CLASS:-RAGDocument}"
      WEAVIATE_MULTI_TENANCY: "${WEAVIATE_MULTI_TENANCY:-true}"
      WEAVIATE_DEFAULT_TENANT: "${WEAVIATE_DEFAULT_TENANT:-tenant-default}"
      WEAVIATE_SKIP_INIT_CHECKS: "${WEAVIATE_SKIP_INIT_CHECKS:-true}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-768}"
      WEAVIATE_LOG_LEVEL: "${WEAVIATE_LOG_LEVEL:-INFO}"

      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "${HOST_REDIS_TCP_PORT:-6379}"

      NEO4J_URI: "bolt://127.0.0.1:${HOST_NEO4J_BOLT_PORT:-7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j123}"

      # EXACT LM Studio URL kept as requested
      OPENAI_API_BASE: "http://127.0.0.1:${HOST_LMSTUDIO_HTTP_PORT:-1234}/v1"
      LMSTUDIO_HOST: "127.0.0.1"
      LM_LLM_URL: "http://127.0.0.1:${HOST_LMSTUDIO_HTTP_PORT:-1234}/v1"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-lm-studio}"

      MODEL_SELECTION: "${MODEL_SELECTION:-first-active}"
      LMSTUDIO_CHAT_MODEL: "${LMSTUDIO_CHAT_MODEL:-}"
      LMSTUDIO_EMBED_MODEL: "${LMSTUDIO_EMBED_MODEL:-}"

      DOCS_PATH: "${DOCS_PATH:-/mnt/Documents/Documents}"
      CHUNK_SIZE: "${CHUNK_SIZE:-500}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-50}"

      # Core service port (internal HTTP API)
      API_PORT: "${HOST_CORE_SERVICE_PORT:-8001}"
      API_MODE: "${API_MODE:-ollama}"

    volumes:
      - ${HOST_DOCS_DIR:?HOST_DOCS_DIR is required}:/mnt/Documents/Documents:Z
      # Libros directory - ACTIVE_LIBROS_DIR is set by check-volumes.sh
      - ${ACTIVE_LIBROS_DIR:?ACTIVE_LIBROS_DIR must be set by check-volumes.sh}:/mnt/resources/Libros:z
      - ${HOST_DATA_DIR:-./data}:/app/data:Z
      - ./.ingestignore:/app/.ingestignore:ro,Z
      # Mount source for hot-reload during development
      - ./src:/app/src:ro,Z
      - ./tests:/app/tests:ro,Z

    # Run as HTTP server (core RAG service)
    # App binds to 0.0.0.0:8001 inside container, accessible at 127.0.0.1:8001 on host via host network
    healthcheck:
      test: ["CMD", "python", "-c", "import os, requests; requests.get(f'http://127.0.0.1:{os.getenv(\"API_PORT\", \"8001\")}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    stop_grace_period: 30s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2.0}"
          memory: "${APP_MEMORY:-3g}"

volumes:
  neo4j_data: {}
  neo4j_logs: {}
  weaviate_data: {}
  redis_data: {}
  librechat_data: {}
  mongodb_data: {}
